<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f8f6">
  <title>JLaw · Quản trị viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:Manrope,sans-serif}:focus-visible{outline:3px solid #c3984f;outline-offset:3px}</style>
</head>
<body class="min-h-screen bg-[#f7f8f6] text-[#16251f] antialiased">
  <header class="border-b border-[#e7eae6] bg-white"><div class="mx-auto flex h-[72px] max-w-6xl items-center justify-between px-5 sm:px-8"><a href="./" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-[#174c3b] font-extrabold text-white">J</span><span><span class="block font-extrabold">JLaw</span><span class="block text-[10px] uppercase tracking-[.16em] text-slate-500">Khu vực quản trị</span></span></a><a href="./" class="text-sm font-semibold text-slate-500 hover:text-[#174c3b]">Trang luyện tập ↗</a></div></header>
  <main class="mx-auto max-w-6xl px-5 py-8 sm:px-8 sm:py-12">
    <section id="loginPanel" class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <p class="text-xs font-bold uppercase tracking-[.14em] text-[#174c3b]">JLAW · ADMIN</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight">Đăng nhập quản trị</h1>
      <p class="mt-2 text-sm leading-6 text-slate-600">Đăng nhập bằng tài khoản Supabase được cấp quyền quản trị để xem điểm và bài làm.</p>
      <form id="loginForm" class="mt-6 space-y-4"><div><label for="email" class="text-sm font-bold">Email</label><input id="email" type="email" autocomplete="username" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-[#174c3b]" placeholder="admin@example.com"></div><div><label for="password" class="text-sm font-bold">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-[#174c3b]"></div><button class="w-full rounded-xl bg-[#174c3b] px-5 py-3 font-bold text-white hover:bg-[#123c2f]">Đăng nhập</button></form>
      <p id="loginMessage" class="mt-4 min-h-5 text-sm text-rose-700" role="status" aria-live="polite"></p>
    </section>
    <section id="dashboard" class="hidden">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-xs font-bold uppercase tracking-[.14em] text-[#174c3b]">BẢNG ĐIỀU KHIỂN</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Điểm và bài làm</h1><p id="adminEmail" class="mt-2 text-sm text-slate-500"></p></div><div class="flex gap-2"><button id="refreshButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold hover:bg-slate-50">Làm mới</button><button id="signOutButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold hover:bg-slate-50">Đăng xuất</button></div></div>
      <div class="mt-6 grid gap-3 sm:grid-cols-3"><div class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Tổng bài nộp</p><p id="totalSubmissions" class="mt-2 text-3xl font-extrabold">—</p></div><div class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Điểm trung bình</p><p id="averageScore" class="mt-2 text-3xl font-extrabold">—</p></div><div class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Thời gian trung bình</p><p id="averageTime" class="mt-2 text-3xl font-extrabold">—</p></div></div>
      <div class="mt-6 flex flex-col gap-3 sm:flex-row"><label class="sr-only" for="searchInput">Tìm học viên</label><input id="searchInput" type="search" placeholder="Tìm theo tên học viên…" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-[#174c3b]"><p id="loadMessage" class="min-h-5 self-center text-sm text-slate-500" role="status" aria-live="polite"></p></div>
      <div id="submissionsList" class="mt-4 space-y-3"></div>
    </section>
  </main>
<script>
(() => {
  const supabase = window.supabase?.createClient('https://ilzpkxdvmrjwddwcjorr.supabase.co','sb_publishable_iA0kFnfnxkL8hpgZMSCN5w_QXltdl5_');
  const loginPanel=document.getElementById('loginPanel'),dashboard=document.getElementById('dashboard'),loginMessage=document.getElementById('loginMessage');
  if(!supabase){loginMessage.textContent='Không tải được Supabase. Hãy kiểm tra kết nối mạng rồi tải lại trang.';return}
  let allRows=[];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const duration=n=>{n=Math.max(0,Number(n)||0);const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
  function setMessage(text,error=false){document.getElementById('loadMessage').textContent=text;document.getElementById('loadMessage').className=`min-h-5 self-center text-sm ${error?'text-rose-700':'text-slate-500'}`}
  function isAdmin(user){return user?.app_metadata?.role==='admin'}
  async function showDashboard(user){if(!isAdmin(user)){loginPanel.classList.remove('hidden');dashboard.classList.add('hidden');loginMessage.textContent='Tài khoản này chưa được cấp quyền Admin. Hãy cập nhật app_metadata.role thành admin rồi đăng nhập lại.';await supabase.auth.signOut();return}loginPanel.classList.add('hidden');dashboard.classList.remove('hidden');document.getElementById('adminEmail').textContent=`Đã đăng nhập: ${user.email}`;await loadRows()}
  async function loadRows(){setMessage('Đang tải dữ liệu…');const {data,error}=await supabase.from('student_scores').select('student_name,score,total_questions,time_taken_seconds,responses,created_at').order('created_at',{ascending:false});if(error){console.warn('Unable to load JLaw submissions:',error);setMessage(`Không tải được dữ liệu: ${error.message}`,true);document.getElementById('submissionsList').innerHTML='';return}allRows=data||[];renderRows()}
  function renderRows(){const query=document.getElementById('searchInput').value.trim().toLocaleLowerCase('vi');const rows=allRows.filter(r=>String(r.student_name||'').toLocaleLowerCase('vi').includes(query));const average=allRows.length?Math.round(allRows.reduce((sum,r)=>sum+(Number(r.score)||0),0)/allRows.length*10)/10:0;const avgTime=allRows.length?Math.round(allRows.reduce((sum,r)=>sum+(Number(r.time_taken_seconds)||0),0)/allRows.length):0;document.getElementById('totalSubmissions').textContent=allRows.length;document.getElementById('averageScore').textContent=allRows.length?`${average} / ${Math.round(allRows.reduce((sum,r)=>sum+(Number(r.total_questions)||0),0)/allRows.length*10)/10}`:'—';document.getElementById('averageTime').textContent=allRows.length?duration(avgTime):'—';setMessage(`${rows.length} bài nộp`);
    document.getElementById('submissionsList').innerHTML=rows.length?rows.map((r,i)=>{const pct=r.total_questions?Math.round(Number(r.score)/Number(r.total_questions)*100):0;const answers=Array.isArray(r.responses)?r.responses:[];return `<article class="overflow-hidden rounded-2xl border border-slate-200 bg-white"><div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center sm:justify-between"><div><h2 class="text-lg font-extrabold">${esc(r.student_name||'Chưa có tên')}</h2><p class="mt-1 text-sm text-slate-500">${r.created_at?new Date(r.created_at).toLocaleString('vi-VN'):'Không có thời gian nộp'}</p></div><div class="flex flex-wrap items-center gap-4"><div><span class="block text-xs text-slate-500">Điểm</span><strong>${Number(r.score)||0}/${Number(r.total_questions)||0} · ${pct}%</strong></div><div><span class="block text-xs text-slate-500">Thời gian làm</span><strong>${duration(r.time_taken_seconds)}</strong></div><button class="reviewButton rounded-lg bg-[#eff6f1] px-4 py-2.5 text-sm font-bold text-[#174c3b] hover:bg-[#d9eee5]" data-review="${i}">Xem bài làm</button></div></div><div id="review-${i}" class="hidden border-t border-slate-100 bg-[#fbfcfb] p-4 sm:p-5">${answers.length?`<div class="space-y-3">${answers.map((a,j)=>{const picked=a.selected_answer;const correct=Number(picked)===Number(a.correct_answer);return `<section class="rounded-xl border ${correct?'border-emerald-200':'border-rose-200'} bg-white p-4"><div class="flex items-start gap-3"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ${correct?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'} text-xs font-extrabold">${j+1}</span><div class="min-w-0"><p class="font-bold">${esc(a.question)}</p><p class="mt-2 text-sm ${correct?'text-emerald-700':'text-rose-700'}">Học viên chọn: ${picked===null||picked===undefined?'Bỏ trống':esc(a.options?.[Number(picked)]??'Không xác định')}</p><p class="mt-1 text-sm font-semibold text-emerald-700">Đáp án đúng: ${esc(a.options?.[Number(a.correct_answer)]??'Không xác định')}</p>${a.explanation?`<p class="mt-2 rounded-lg bg-slate-50 p-3 text-sm leading-6 text-slate-600">${esc(a.explanation)}</p>`:''}</div></div></section>`}).join('')}</div>`:'<p class="text-sm text-amber-800">Bài nộp này chưa có dữ liệu câu trả lời chi tiết. Các bài làm mới sẽ lưu phần này sau khi cập nhật cơ sở dữ liệu.</p>'}</div></article>`}).join(''):'<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">Chưa có bài nộp phù hợp.</div>';
    document.querySelectorAll('.reviewButton').forEach(button=>button.addEventListener('click',()=>{const panel=document.getElementById(`review-${button.dataset.review}`);panel.classList.toggle('hidden');button.textContent=panel.classList.contains('hidden')?'Xem bài làm':'Thu gọn'}))}
  document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMessage.textContent='Đang đăng nhập…';const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){loginMessage.textContent=`Đăng nhập thất bại: ${error.message}`;return}await showDashboard(data.user)});
  document.getElementById('refreshButton').addEventListener('click',loadRows);document.getElementById('signOutButton').addEventListener('click',async()=>{await supabase.auth.signOut();dashboard.classList.add('hidden');loginPanel.classList.remove('hidden');loginMessage.textContent='Bạn đã đăng xuất.'});document.getElementById('searchInput').addEventListener('input',renderRows);
  supabase.auth.getSession().then(({data})=>{if(data.session)showDashboard(data.session.user)});
})();
</script>
</body>
</html>
