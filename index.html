<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="JLaw — luyện tập trắc nghiệm pháp luật.">
  <title>JLaw — Luyện tập pháp luật</title><link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:Manrope,sans-serif}:focus-visible{outline:3px solid #111;outline-offset:3px}.option-card:has(input:checked){border-color:#111;background:#f5f5f5;box-shadow:0 0 0 1px #111}.progress-fill{transition:width .3s ease}</style>
</head>
<body class="min-h-screen bg-white text-black antialiased"><div class="min-h-screen flex flex-col">
<header class="border-b border-neutral-200 bg-white"><div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-5 sm:px-8"><a href="./" class="flex items-center gap-3"><img src="logo.png" alt="Logo JLaw" class="h-11 w-11 object-contain"><span><b class="block text-[17px]">JLaw</b><span class="block -mt-0.5 text-[10px] uppercase tracking-[.16em] text-neutral-500">Học luật sáng rõ</span></span></a><div class="flex items-center gap-3"><span id="studentEmail" class="hidden text-sm text-neutral-500 sm:inline"></span><button id="signOut" class="rounded-lg border border-neutral-300 px-3 py-2 text-sm font-semibold hover:bg-neutral-100">Đăng xuất</button></div></div></header>
<main class="flex-1"><div id="app" class="mx-auto max-w-6xl px-5 py-8 sm:px-8 sm:py-12"></div></main><footer class="border-t border-neutral-200 bg-neutral-50"><div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-5 py-5 text-xs text-neutral-500 sm:flex-row sm:px-8"><span>© <span id="year"></span> JLaw · Học luật có mục tiêu.</span><span>Kết quả được lưu vào tài khoản học viên.</span></div></footer></div>
<script>
(()=>{'use strict';
const sb=window.supabase?.createClient('https://ilzpkxdvmrjwddwcjorr.supabase.co','sb_publishable_iA0kFnfnxkL8hpgZMSCN5w_QXltdl5_');
const $=id=>document.getElementById(id), app=$('app'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='jlaw_student_session_v2', HIST='jlaw_local_attempts_v2';let user=null,banks=[],session=readSession(),attempts=readHistory(),timer=null,startTime=null;
function readSession(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function readHistory(){try{return JSON.parse(localStorage.getItem(HIST))||[]}catch{return []}}function persist(){localStorage.setItem(KEY,JSON.stringify(session))}function duration(n){n=Math.max(0,Number(n)||0);const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function toast(t){const el=document.createElement('div');el.className='fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-black px-4 py-3 text-sm font-semibold text-white shadow-lg';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2800)}
function active(){return banks.find(b=>b.id===session?.bankId)||banks.find(b=>b.id===document.getElementById('quizSelect')?.value)||banks[0]}
function render(){clearInterval(timer);$('signOut').disabled=session?.status==='taking';$('signOut').classList.toggle('opacity-40',session?.status==='taking');if(session?.status==='taking')return renderQuiz();if(session?.status==='result')return renderResult();renderHome()}
function renderHome(){const oldId=session?.bankId||localStorage.getItem('jlaw_selected_quiz'),selected=banks.find(b=>b.id===oldId)||banks[0],latest=attempts[0];app.innerHTML=`<section class="grid items-center gap-10 py-4 lg:grid-cols-[1.1fr_.9fr]"><div><span class="inline-flex rounded-full bg-neutral-100 px-3 py-1.5 text-xs font-bold tracking-wide">GÓC LUYỆN TẬP CỦA BẠN</span><h1 class="mt-6 text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl">Rèn tư duy pháp lý,<br>từng câu hỏi một.</h1><p class="mt-5 max-w-xl text-base leading-7 text-neutral-600">Chọn bài tập để luyện tập. Bạn có thể làm nhiều bài trong ngày; kết quả và thời gian sẽ được lưu cho tài khoản.</p><div class="mt-8 grid max-w-lg grid-cols-2 gap-3"><div class="rounded-xl border border-neutral-200 p-4"><p class="text-xs font-semibold uppercase text-neutral-500">Bài tập khả dụng</p><p class="mt-1 font-bold">${banks.length} bài</p></div><div class="rounded-xl border border-neutral-200 p-4"><p class="text-xs font-semibold uppercase text-neutral-500">Hôm nay đã làm</p><p class="mt-1 font-bold">${attempts.filter(a=>new Date(a.timestamp).toDateString()===new Date().toDateString()).length} bài</p></div></div>${latest?`<p class="mt-4 text-sm text-neutral-500">Kết quả gần nhất: <b>${esc(latest.bankName)}</b> · <b>${latest.percentage}%</b></p>`:''}</div><section class="rounded-3xl border border-neutral-200 bg-white p-6 shadow-[0_16px_50px_rgba(0,0,0,.07)] sm:p-8"><div class="flex items-center gap-3"><img src="logo.png" alt="" class="h-12 w-12 object-contain"><div><p class="text-sm font-semibold text-neutral-500">Xin chào</p><h2 class="text-xl font-extrabold">${esc(user.user_metadata?.full_name||user.email)}</h2></div></div>${banks.length?`<form id="startForm" class="mt-7"><label for="quizSelect" class="block text-sm font-bold">Chọn bài tập</label><select id="quizSelect" class="mt-2 w-full rounded-xl border border-neutral-300 bg-white px-4 py-3.5 outline-none focus:border-black">${banks.map(b=>`<option value="${esc(b.id)}" ${b.id===selected.id?'selected':''}>${esc(b.name)} · ${b.questions.length} câu · ${Number(b.minutes)||20} phút</option>`).join('')}</select><p id="quizMeta" class="mt-2 text-xs text-neutral-500">Thời gian làm bài: ${Number(selected.minutes)||20} phút. Không giới hạn số bài mỗi ngày.</p><button class="mt-6 w-full rounded-xl bg-black px-5 py-3.5 text-sm font-bold text-white hover:bg-neutral-800">Bắt đầu làm bài <span aria-hidden="true">→</span></button></form>`:`<div class="mt-6 rounded-xl bg-neutral-50 p-4 text-sm leading-6 text-neutral-600">Chưa có bài tập nào. Vui lòng liên hệ Admin để được giao bài.</div>`}<div class="mt-6 border-t border-neutral-200 pt-5 text-xs text-neutral-500">Khi bắt đầu, bài làm sẽ khóa đến khi nộp hoặc hết giờ.</div></section></section><section class="mt-12 border-t border-neutral-200 pt-7"><h2 class="font-bold">Lịch sử làm bài</h2><p class="mt-1 text-sm text-neutral-500">Các lần làm gần đây trên thiết bị này.</p><div class="mt-4 space-y-2">${attempts.slice(0,8).map(a=>`<div class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-neutral-200 px-4 py-3 text-sm"><span><b>${esc(a.bankName)}</b><span class="text-neutral-500"> · ${new Date(a.timestamp).toLocaleString('vi-VN')}</span></span><b>${a.correct}/${a.total} · ${a.percentage}% · ${duration(a.timeTakenSeconds)}</b></div>`).join('')||'<p class="text-sm text-neutral-500">Chưa có bài làm nào.</p>'}</div></section>`;
$('quizSelect')?.addEventListener('change',e=>{localStorage.setItem('jlaw_selected_quiz',e.target.value);const b=banks.find(x=>x.id===e.target.value);$('quizMeta').textContent=`Thời gian làm bài: ${Number(b?.minutes)||20} phút. Không giới hạn số bài mỗi ngày.`});$('startForm')?.addEventListener('submit',e=>{e.preventDefault();const b=banks.find(x=>x.id===$('quizSelect').value);if(!b?.questions?.length){toast('Bài tập hiện chưa có câu hỏi.');return}startTime=new Date();session={status:'taking',name:user.user_metadata?.full_name||user.email,bankId:b.id,bankName:b.name,questions:structuredClone(b.questions),answers:{},startedAt:startTime.toISOString(),deadlineAt:Date.now()+(Number(b.minutes)||20)*60000};persist();render()})}
function renderQuiz(){const qs=session.questions||[],answered=Object.values(session.answers||{}).filter(x=>x!==null&&x!==undefined).length;app.innerHTML=`<div class="mx-auto max-w-4xl"><div class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-wider text-neutral-500">${esc(session.bankName)}</p><h1 class="mt-1 text-2xl font-extrabold sm:text-3xl">Tập trung làm bài, ${esc(session.name)}</h1></div><div class="flex items-center gap-3"><div class="rounded-xl bg-neutral-100 px-4 py-2 text-center"><span class="block text-[10px] font-bold uppercase text-neutral-500">Đã làm</span><span id="elapsed" class="text-lg font-extrabold tabular-nums">00:00</span></div><div id="remaining" class="text-sm font-semibold tabular-nums text-neutral-600">Còn --:--</div></div></div><div class="mt-6 h-2 overflow-hidden rounded-full bg-neutral-100"><div id="progress" class="progress-fill h-full bg-black" style="width:${answered/qs.length*100}%"></div></div><p class="mt-2 text-xs text-neutral-500"><span id="answered">${answered}</span>/${qs.length} câu đã trả lời</p><form id="quizForm" class="mt-6 space-y-4">${qs.map((q,i)=>`<fieldset class="rounded-2xl border border-neutral-200 bg-white p-5 sm:p-7"><legend class="sr-only">Câu ${i+1}</legend><p class="font-bold leading-6"><span class="mr-2 inline-grid h-8 w-8 place-items-center rounded-lg bg-neutral-100 text-sm">${String(i+1).padStart(2,'0')}</span>${esc(q.question)}</p><div class="mt-4 grid gap-2">${q.options.map((o,j)=>`<label class="option-card flex cursor-pointer items-start gap-3 rounded-xl border border-neutral-200 p-3.5"><input type="radio" name="q${i}" value="${j}" ${Number(session.answers[i])===j?'checked':''} class="mt-0.5 h-4 w-4 accent-black"><span class="text-sm leading-5">${esc(o)}</span></label>`).join('')}</div></fieldset>`).join('')}<div class="sticky bottom-3 flex flex-col items-center justify-between gap-3 rounded-2xl border border-neutral-200 bg-white/95 p-4 shadow-lg backdrop-blur sm:flex-row"><p id="leftCount" class="text-sm text-neutral-600">${qs.length-answered} câu chưa trả lời</p><button type="submit" class="w-full rounded-xl bg-black px-7 py-3 text-sm font-bold text-white hover:bg-neutral-800 sm:w-auto">Nộp bài</button></div></form></div>`;
if(!startTime)startTime=new Date(session.startedAt);const tick=()=>{const elapsed=Math.floor((Date.now()-startTime)/1000),left=Math.max(0,Math.ceil((session.deadlineAt-Date.now())/1000));$('elapsed').textContent=duration(elapsed);$('remaining').textContent='Còn '+duration(left);if(left===0){clearInterval(timer);grade()}};tick();timer=setInterval(tick,1000);document.querySelectorAll('#quizForm input').forEach(input=>input.addEventListener('change',e=>{session.answers[Number(e.target.name.slice(1))]=Number(e.target.value);persist();const n=Object.values(session.answers).filter(x=>x!==null&&x!==undefined).length;$('answered').textContent=n;$('leftCount').textContent=`${qs.length-n} câu chưa trả lời`;$('progress').style.width=`${n/qs.length*100}%`}));$('quizForm').addEventListener('submit',e=>{e.preventDefault();grade()})}
function grade(){if(session?.status!=='taking')return;clearInterval(timer);if(!startTime)startTime=new Date(session.startedAt);const timeTakenSeconds=Math.floor((new Date()-startTime)/1000),qs=session.questions;let correct=0;qs.forEach((q,i)=>{if(Number(session.answers[i])===Number(q.correctAnswer))correct++});const result={id:crypto.randomUUID?.()||String(Date.now()),name:session.name,bankId:session.bankId,bankName:session.bankName,correct,total:qs.length,percentage:Math.round(correct/qs.length*100),timestamp:new Date().toISOString(),timeTakenSeconds,questions:qs,answers:session.answers,cloudSyncStatus:'pending'};attempts.unshift(result);localStorage.setItem(HIST,JSON.stringify(attempts));session={status:'result',resultId:result.id};persist();render();syncScore(result)}
async function syncScore(r){try{if(!sb)throw new Error('Supabase client unavailable');const {error}=await sb.from('student_scores').insert({student_name:r.name,student_id:user.id,quiz_set_id:r.bankId,score:r.correct,total_questions:r.total,time_taken_seconds:r.timeTakenSeconds,responses:r.questions.map((q,i)=>({question:q.question,options:q.options,selected_answer:r.answers?.[i]??null,correct_answer:q.correctAnswer,explanation:q.explanation||''}))});if(error)throw error;r.cloudSyncStatus='saved'}catch(e){console.warn('Supabase score save failed; local result kept.',e);r.cloudSyncStatus='failed'}localStorage.setItem(HIST,JSON.stringify(attempts));if(session?.resultId===r.id)renderResult()}
function renderResult(){const r=attempts.find(a=>a.id===session.resultId);if(!r){session=null;persist();return renderHome()}app.innerHTML=`<section class="mx-auto max-w-5xl"><div class="rounded-3xl bg-black p-6 text-white sm:p-9"><p class="text-xs font-bold uppercase tracking-widest text-neutral-300">HOÀN THÀNH BÀI TẬP</p><div class="mt-3 flex flex-col justify-between gap-6 sm:flex-row sm:items-center"><div><h1 class="text-3xl font-extrabold">Làm tốt lắm, ${esc(r.name)}.</h1><p class="mt-2 text-neutral-300">${esc(r.bankName)} · Thời gian làm: ${duration(r.timeTakenSeconds)}</p><p class="mt-2 text-sm text-neutral-300">${r.cloudSyncStatus==='saved'?'Kết quả đã được đồng bộ.':r.cloudSyncStatus==='failed'?'Chưa đồng bộ được; kết quả vẫn còn trên thiết bị này.':'Đang lưu kết quả…'}</p></div><div class="text-center"><p class="text-5xl font-extrabold">${r.percentage}%</p><p class="mt-1 text-sm text-neutral-300">${r.correct} / ${r.total} câu đúng</p></div></div></div><div class="mt-5 flex flex-wrap gap-3"><button id="again" class="rounded-xl bg-black px-5 py-3 text-sm font-bold text-white hover:bg-neutral-800">Chọn bài khác</button><button id="export" class="rounded-xl border border-neutral-300 px-5 py-3 text-sm font-bold hover:bg-neutral-100">Tải kết quả CSV</button></div><div class="mt-9"><p class="text-xs font-bold uppercase tracking-widest text-neutral-500">XEM LẠI ĐÁP ÁN</p><h2 class="mt-1 text-2xl font-extrabold">Học từ từng câu hỏi</h2><div class="mt-5 space-y-4">${r.questions.map((q,i)=>{const picked=r.answers?.[i],ok=Number(picked)===Number(q.correctAnswer);return `<article class="rounded-2xl border ${ok?'border-green-300':'border-red-300'} bg-white p-5"><div class="flex items-start gap-3"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg ${ok?'bg-green-100 text-green-800':'bg-red-100 text-red-800'} font-bold">${i+1}</span><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><h3 class="font-bold">${esc(q.question)}</h3><span class="rounded-full px-2 py-1 text-xs font-bold ${ok?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}">${ok?'Đúng':'Chưa đúng'}</span></div><div class="mt-3 grid gap-3 sm:grid-cols-2"><p class="rounded-xl ${ok?'bg-green-50 text-green-900':'bg-red-50 text-red-900'} p-3 text-sm"><b>Bạn chọn:</b> ${picked===undefined?'Bỏ trống':esc(q.options[Number(picked)]??'Không xác định')}</p><p class="rounded-xl bg-green-50 p-3 text-sm text-green-900"><b>Đáp án đúng:</b> ${esc(q.options[Number(q.correctAnswer)])}</p></div><p class="mt-3 rounded-xl bg-neutral-50 p-4 text-sm leading-6 text-neutral-700"><b>Giải thích:</b> ${esc(q.explanation||'Chưa có giải thích.')}</p></div></div></article>`}).join('')}</div></div></section>`;$('again').addEventListener('click',()=>{session=null;startTime=null;persist();renderHome()});$('export').addEventListener('click',()=>downloadCSV([r]))}
function downloadCSV(rows){const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',data=[['Tên học viên','Bài tập','Số câu đúng','Tổng số câu','Phần trăm','Thời gian (giây)','Thời điểm'],...rows.map(r=>[r.name,r.bankName,r.correct,r.total,r.percentage+'%',r.timeTakenSeconds,r.timestamp])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data.map(x=>x.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='jlaw-ket-qua.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){if(!sb){app.innerHTML='<p class="rounded-xl bg-red-50 p-5 text-red-800">Không tải được kết nối Supabase. Vui lòng thử tải lại trang.</p>';return}const {data,error}=await sb.auth.getSession();user=data.session?.user;if(error||!user){location.replace('login.html?role=student');return}if(user.app_metadata?.role==='admin'){location.replace('admin.html');return}$('studentEmail').textContent=user.user_metadata?.full_name||user.email;const {data:sets,error:setsError}=await sb.from('quiz_sets').select('id,name,minutes,questions,is_active').eq('is_active',true).order('created_at',{ascending:false});if(setsError){console.warn('Cannot load quiz sets',setsError);app.innerHTML=`<div class="rounded-2xl border border-red-200 bg-red-50 p-5 text-red-800"><b>Không tải được danh sách bài tập.</b><p class="mt-2 text-sm">${esc(setsError.message)}. Hãy kiểm tra cấu hình Supabase và chính sách truy cập quiz_sets.</p></div>`;return}banks=(sets||[]).map(b=>({...b,questions:Array.isArray(b.questions)?b.questions:[]}));if(session?.status==='taking'&&banks.some(b=>b.id===session.bankId)){startTime=new Date(session.startedAt);render()}else{if(session?.status==='taking'){session=null;persist()}render()}}
$('signOut').addEventListener('click',async()=>{if(session?.status==='taking')return;await sb.auth.signOut();session=null;localStorage.removeItem(KEY);location.replace('login.html?role=student')});$('year').textContent=new Date().getFullYear();boot();
})();
</script></body></html>
