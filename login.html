<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
  <title>JLaw · Đăng nhập</title><link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif}h1,h2{font-family:Manrope,sans-serif}:focus-visible{outline:3px solid #111;outline-offset:2px}</style>
</head>
<body class="min-h-screen bg-white text-black antialiased">
  <header class="border-b border-neutral-200 bg-white"><div class="mx-auto flex h-[72px] max-w-6xl items-center justify-between px-5 sm:px-8"><a href="./" class="flex items-center gap-3"><img src="logo.png" alt="Logo JLaw" class="h-11 w-11 object-contain"><span><span class="block font-extrabold">JLaw</span><span class="block text-[10px] uppercase tracking-[.16em] text-neutral-500">Since 2026</span></span></a><a href="./" class="text-sm font-semibold text-neutral-600 hover:text-black">Trang chủ</a></div></header>
  <main class="mx-auto grid min-h-[calc(100vh-73px)] max-w-6xl items-center gap-10 px-5 py-10 sm:px-8 lg:grid-cols-2">
    <section class="hidden lg:block"><p class="text-xs font-bold uppercase tracking-[.16em]">JLAW · LUYỆN TẬP PHÁP LUẬT</p><h1 class="mt-4 max-w-xl text-5xl font-extrabold leading-tight tracking-tight">Đăng nhập để tiếp tục hành trình học luật.</h1><p class="mt-5 max-w-lg leading-7 text-neutral-600">Làm nhiều bộ câu hỏi, lưu tiến độ và xem lại kết quả của bạn.</p></section>
    <section class="mx-auto w-full max-w-md rounded-3xl border border-neutral-200 bg-white p-6 shadow-[0_16px_50px_rgba(0,0,0,.08)] sm:p-8">
      <div class="flex rounded-xl bg-neutral-100 p-1"><button id="studentRole" class="flex-1 rounded-lg bg-black px-3 py-2.5 text-sm font-bold text-white">Học viên</button><button id="adminRole" class="flex-1 rounded-lg px-3 py-2.5 text-sm font-bold text-neutral-600">Quản trị viên</button></div>
      <div class="mt-6"><p class="text-xs font-bold uppercase tracking-[.14em] text-neutral-500" id="roleLabel">TÀI KHOẢN HỌC VIÊN</p><h2 id="formTitle" class="mt-1 text-2xl font-extrabold">Đăng nhập</h2><p id="formDescription" class="mt-2 text-sm leading-6 text-neutral-600">Đăng nhập để chọn và làm các bài tập đã được giao.</p></div>
      <div id="studentActions" class="mt-5 flex gap-2"><button id="loginMode" class="rounded-full bg-neutral-100 px-4 py-2 text-xs font-bold">Đăng nhập</button><button id="signupMode" class="rounded-full px-4 py-2 text-xs font-bold text-neutral-500">Tạo tài khoản</button></div>
      <form id="authForm" class="mt-5 space-y-4"><div id="nameField" class="hidden"><label for="fullName" class="text-sm font-bold">Họ và tên</label><input id="fullName" maxlength="80" autocomplete="name" class="mt-1.5 w-full rounded-xl border border-neutral-300 px-4 py-3 outline-none focus:border-black"></div><div><label for="email" class="text-sm font-bold">Email</label><input id="email" type="email" required autocomplete="username" class="mt-1.5 w-full rounded-xl border border-neutral-300 px-4 py-3 outline-none focus:border-black" placeholder="ban@example.com"></div><div><label for="password" class="text-sm font-bold">Mật khẩu</label><input id="password" type="password" required minlength="6" autocomplete="current-password" class="mt-1.5 w-full rounded-xl border border-neutral-300 px-4 py-3 outline-none focus:border-black" placeholder="Ít nhất 6 ký tự"></div><button id="submitButton" class="w-full rounded-xl bg-black px-5 py-3.5 text-sm font-bold text-white hover:bg-neutral-800">Đăng nhập</button></form>
      <p id="formMessage" class="mt-4 min-h-6 text-sm text-neutral-600" role="status" aria-live="polite"></p>
    </section>
  </main>
<script>
(() => {
  const supabase=window.supabase?.createClient('https://ilzpkxdvmrjwddwcjorr.supabase.co','sb_publishable_iA0kFnfnxkL8hpgZMSCN5w_QXltdl5_');
  const params=new URLSearchParams(location.search);let role=params.get('role')==='admin'?'admin':'student',mode='login';
  const $=id=>document.getElementById(id),message=$('formMessage');
  function paint(){const admin=role==='admin',signup=mode==='signup';$('studentRole').className=`flex-1 rounded-lg px-3 py-2.5 text-sm font-bold ${admin?'text-neutral-600':'bg-black text-white'}`;$('adminRole').className=`flex-1 rounded-lg px-3 py-2.5 text-sm font-bold ${admin?'bg-black text-white':'text-neutral-600'}`;$('studentActions').classList.toggle('hidden',admin);$('nameField').classList.toggle('hidden',!signup||admin);$('roleLabel').textContent=admin?'KHU VỰC QUẢN TRỊ':'TÀI KHOẢN HỌC VIÊN';$('formTitle').textContent=admin?'Đăng nhập quản trị':signup?'Tạo tài khoản học viên':'Đăng nhập';$('formDescription').textContent=admin?'Dùng tài khoản Supabase đã được cấp quyền Admin.':signup?'Tạo tài khoản để lưu điểm và làm nhiều bài tập trong ngày.':'Đăng nhập để chọn và làm các bài tập đã được giao.';$('submitButton').textContent=admin||!signup?'Đăng nhập':'Tạo tài khoản';$('loginMode').className=`rounded-full px-4 py-2 text-xs font-bold ${mode==='login'?'bg-neutral-100':'text-neutral-500'}`;$('signupMode').className=`rounded-full px-4 py-2 text-xs font-bold ${mode==='signup'?'bg-neutral-100':'text-neutral-500'}`;params.set('role',role);history.replaceState(null,'',`${location.pathname}?${params.toString()}`)}
  async function routeSession(session){if(!session)return false;const isAdmin=session.user?.app_metadata?.role==='admin';if(role==='admin'&& !isAdmin){await supabase.auth.signOut();message.textContent='Tài khoản chưa được cấp quyền Admin.';return true}location.replace(isAdmin?'admin.html':'index.html');return true}
  $('studentRole').addEventListener('click',()=>{role='student';mode='login';message.textContent='';paint()});$('adminRole').addEventListener('click',()=>{role='admin';mode='login';message.textContent='';paint()});$('loginMode').addEventListener('click',()=>{mode='login';message.textContent='';paint()});$('signupMode').addEventListener('click',()=>{mode='signup';message.textContent='';paint()});
  $('authForm').addEventListener('submit',async e=>{e.preventDefault();if(!supabase){message.textContent='Không tải được Supabase. Hãy kiểm tra kết nối mạng.';return}const email=$('email').value.trim(),password=$('password').value;message.textContent='Đang xử lý…';$('submitButton').disabled=true;try{if(role==='admin'||mode==='login'){const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await routeSession(data.session);if(role==='admin'&&data.user.app_metadata?.role!=='admin')return}else{const fullName=$('fullName').value.trim();if(!fullName)throw new Error('Vui lòng nhập họ và tên.');const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:fullName}}});if(error)throw error;if(data.session){location.replace('index.html')}else{message.textContent='Tài khoản đã tạo. Hãy xác nhận email rồi đăng nhập.'}}}catch(error){message.textContent=error.message||'Không thể đăng nhập lúc này.'}finally{$('submitButton').disabled=false}});
  if(!supabase){message.textContent='Không tải được Supabase. Hãy kiểm tra kết nối mạng.'}else{supabase.auth.getSession().then(({data})=>routeSession(data.session))}paint();
})();
</script>
</body>
</html>
