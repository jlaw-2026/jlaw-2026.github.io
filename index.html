<script>
(() => {
  'use strict';

    {question:'Trong một vụ kiện dân sự thông thường, nguyên đơn cần đáp ứng tiêu chuẩn chứng minh nào?',options:['Không còn nghi ngờ hợp lý','Chứng cứ rõ ràng và thuyết phục','Cán cân xác suất','Sự chắc chắn tuyệt đối'],correctAnswer:2,explanation:'Tiêu chuẩn dân sự thường dùng là cán cân xác suất. Tòa án cần thấy tình tiết được viện dẫn có khả năng đúng cao hơn khả năng không đúng.'},

  ];
  const read = (key, fallback) => { try { const v=localStorage.getItem(key); return v===null?fallback:JSON.parse(v) } catch { return fallback } };
  const write = (key,value) => localStorage.setItem(key,JSON.stringify(value));
  let banks=read(KEYS.banks,null); if(!Array.isArray(banks)||!banks.length){ banks=[{id:'default',name:'Kiến thức pháp luật cơ bản',minutes:20,questions:seed}]; write(KEYS.banks,banks) }
  let activeBankId=read(KEYS.activeBank,banks[0].id); if(!banks.some(b=>b.id===activeBankId))activeBankId=banks[0].id;

  let attempts=read(KEYS.attempts,[]); if(!Array.isArray(attempts))attempts=[];
  let session=read(KEYS.session,null); let view=new URLSearchParams(location.search).get('admin')==='1'?'manager':'practice'; let timerInterval=null; let startTime=null;
  const app=document.getElementById('app'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const activeBank=()=>banks.find(b=>b.id===activeBankId)||banks[0];
  if(session?.status==='taking'){startTime=new Date(session.startedAt||Date.now());if(!session.deadlineAt){session.deadlineAt=Date.now()+Number((banks.find(b=>b.id===session.bankId)||activeBank()).minutes||20)*60000;write(KEYS.session,session)}}

  const persist=()=>write(KEYS.session,session);
  const setView=v=>{view=v;document.getElementById('navPractice').className='nav-btn px-3 sm:px-4 py-2 rounded-lg text-sm font-semibold '+(v==='practice'?'text-forest bg-mint/60':'text-slate-600 hover:bg-slate-100');document.getElementById('navPractice').toggleAttribute('aria-current',v==='practice');render()};
  const icon=(path)=>`<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">${path}</svg>`;
  function render(){ if(view==='manager'){renderManager();return} if(session?.status==='result'){renderResult();return} if(session?.status==='taking'){renderQuiz();return} renderHome() }
  function renderHome(){const bank=activeBank();const latest=attempts[0];app.innerHTML=`<section class="grid lg:grid-cols-[1.1fr_.9fr] gap-10 lg:gap-16 items-center py-3 sm:py-8 fade-in"><div><div class="inline-flex items-center gap-2 rounded-full bg-mint/70 px-3 py-1.5 text-xs font-bold tracking-wide text-forest"><span class="w-1.5 h-1.5 rounded-full bg-forest"></span> GÓC LUYỆN TẬP CỦA BẠN</div><h1 class="display mt-6 text-4xl sm:text-5xl lg:text-[58px] leading-[1.08] font-extrabold tracking-[-.045em] text-ink">Rèn tư duy<br class="hidden sm:block"> pháp lý, <span class="text-forest">từng câu hỏi</span><br class="hidden sm:block"> một.</h1><p class="mt-5 max-w-xl text-base sm:text-lg leading-7 text-slate-600">Không gian tập trung để củng cố kiến thức pháp luật. Hãy luyện tập theo nhịp độ của bạn và rút kinh nghiệm sau mỗi câu trả lời.</p><div class="mt-8 grid grid-cols-2 gap-3 max-w-lg"><div class="rounded-xl border border-[#e4e8e3] bg-white p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Bộ câu hỏi</p><p class="mt-1 font-bold text-ink">${esc(bank.name)}</p></div><div class="rounded-xl border border-[#e4e8e3] bg-white p-4"><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Số câu hỏi</p><p class="mt-1 font-bold text-ink">${bank.questions.length} <span class="font-normal text-slate-500">câu để luyện tập</span></p></div></div>${latest?`<p class="mt-4 text-sm text-slate-500">Lần làm gần nhất: <strong class="text-ink">${esc(latest.name)}</strong> đạt <strong class="text-forest">${latest.percentage}%</strong></p>`:''}</div><div class="relative"><div class="absolute -inset-4 rounded-[2rem] bg-[#e7f0e9] rotate-2"></div><div class="relative rounded-3xl bg-white p-6 sm:p-8 shadow-soft border border-[#e8ece7]"><div class="flex items-center justify-between"><div><p class="text-sm font-semibold text-slate-500">Sẵn sàng khi bạn bắt đầu</p><h2 class="mt-1 text-2xl font-extrabold tracking-tight">${session?.status==='paused'?'Tiếp tục bài làm':'Bắt đầu luyện tập'}</h2></div><div class="w-12 h-12 rounded-2xl bg-[#eff6f1] text-forest grid place-items-center">${icon('<path d="M8 4h8l4 4v12H4V4h4Zm0 0v5h8V4M8 14h8M8 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>')}</div></div><form id="startForm" class="mt-7"><label for="studentName" class="block text-sm font-bold text-ink">Họ và tên</label><input id="studentName" name="studentName" required maxlength="80" autocomplete="name" placeholder="Ví dụ: Nguyễn An" value="${esc(session?.name||'')}" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-base outline-none transition placeholder:text-slate-400 focus:border-forest focus:ring-4 focus:ring-forest/10"><p class="mt-2 text-xs text-slate-500">Tên của bạn sẽ hiển thị cùng kết quả được lưu.</p><button class="mt-6 w-full rounded-xl bg-forest px-5 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-[#123c2f] focus:ring-4 focus:ring-forest/20" type="submit">${session?.status==='paused'?'Tiếp tục bài đang làm':'Bắt đầu làm bài'} <span aria-hidden="true" class="ml-1">→</span></button></form><div class="mt-6 pt-5 border-t border-slate-100 flex items-center gap-3 text-xs text-slate-500"><span class="text-forest">${icon('<path d="M12 3 4.5 6v5c0 4.6 3.2 8.2 7.5 10 4.3-1.8 7.5-5.4 7.5-10V6L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>')}</span><span>Câu trả lời được tự động lưu trên thiết bị này.</span></div></div></div></section><section class="mt-12 sm:mt-16 border-t border-[#e4e8e3] pt-7 flex flex-col sm:flex-row sm:items-center justify-between gap-4"><div><h2 class="text-sm font-bold">Theo dõi tiến độ học tập</h2><p class="mt-1 text-sm text-slate-500">Xem lại các lần làm bài hoặc tải bảng điểm xuống.</p></div><div class="flex gap-2"><button id="historyBtn" class="rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">${attempts.length} lần làm bài đã lưu</button><button id="homeExport" class="rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50" ${attempts.length?'':'disabled'}>Tải CSV</button></div></section><div id="historyPanel"></div>`;
    document.getElementById('startForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('studentName').value.trim();if(!name)return;if(session?.status==='paused'&&session.bankId===activeBankId){session.name=name;session.status='taking';persist();render();return}if(!activeBank().questions.length){toast('Hãy nhờ giảng viên thêm câu hỏi trước khi bắt đầu.');return}startTime = new Date(); session={status:'taking',name,bankId:activeBankId,questions:JSON.parse(JSON.stringify(activeBank().questions)),answers:{},startedAt:startTime.toISOString(),deadlineAt:Date.now()+(Number(activeBank().minutes)||20)*60000};persist();render()});
    document.getElementById('homeExport').addEventListener('click',exportCSV);document.getElementById('historyBtn').addEventListener('click',()=>{const el=document.getElementById('historyPanel');el.innerHTML=el.innerHTML? '':historyHTML();}); }
  function renderQuiz(){if(!session.questions?.length){session=null;persist();renderHome();return}const qs=session.questions;const answered=Object.keys(session.answers||{}).filter(k=>session.answers[k]!==null).length;app.innerHTML=`<div class="max-w-4xl mx-auto fade-in"><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-[.14em] text-forest">${esc(banks.find(b=>b.id===session.bankId)?.name||'Bài luyện tập pháp luật')}</p><h1 class="mt-1 text-2xl sm:text-3xl font-extrabold tracking-tight">Cứ bình tĩnh nhé, ${esc(session.name)}.</h1></div><div class="flex items-center gap-4"><div class="rounded-xl bg-[#eff6f1] px-4 py-2 text-center"><span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500">Đã làm</span><span id="elapsedTimerDisplay" class="text-lg font-extrabold tabular-nums text-forest">00:00</span></div><div id="deadlineTimer" class="text-xs text-slate-500">Còn --:--</div></div></div><div class="mt-6 rounded-full bg-[#e6eae6] h-2 overflow-hidden"><div class="progress-fill h-full bg-forest rounded-full" style="width:${Math.round(answered/qs.length*100)}%"></div></div><div class="mt-2 flex justify-between text-xs text-slate-500"><span>${answered}/${qs.length} câu đã trả lời</span><span>${qs.length} câu hỏi</span></div><form id="quizForm" class="mt-7 space-y-5">${qs.map((q,i)=>`<fieldset class="rounded-2xl border border-[#e4e8e3] bg-white p-5 sm:p-7 shadow-[0_2px_12px_rgba(22,37,31,.025)]"><legend class="sr-only">Câu ${i+1}</legend><div class="flex gap-4"><span class="shrink-0 w-9 h-9 grid place-items-center rounded-xl bg-[#eff6f1] text-sm font-extrabold text-forest">${String(i+1).padStart(2,'0')}</span><div class="min-w-0 flex-1"><p class="font-bold leading-6 text-ink">${esc(q.question)}</p><div class="mt-4 grid gap-2.5">${q.options.map((opt,j)=>`<label class="option-card flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 p-3.5 transition hover:border-[#9bb8a8]"><input type="radio" name="q${i}" value="${j}" ${Number(session.answers[i])===j?'checked':''} class="mt-0.5 h-4 w-4 accent-[#174c3b]" aria-label="${esc(opt)}"><span class="text-sm leading-5 text-slate-700">${esc(opt)}</span></label>`).join('')}</div></div></div></fieldset>`).join('')}<div class="sticky bottom-3 z-10 rounded-2xl border border-[#e4e8e3] bg-white/95 p-3 sm:p-4 shadow-soft backdrop-blur flex flex-col sm:flex-row items-center justify-between gap-3"><p class="text-sm text-slate-600">${qs.length-answered?`<strong>${qs.length-answered}</strong> chưa trả lời`:'Đã trả lời tất cả câu hỏi'}</p><button type="button" id="clearAnswers" class="w-full sm:w-auto rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">Xóa câu trả lời</button><button type="submit" class="w-full sm:w-auto rounded-xl bg-forest px-7 py-3 text-sm font-bold text-white hover:bg-[#123c2f] focus:ring-4 focus:ring-forest/20">Nộp bài</button></div></form></div>`;
    document.getElementById('clearAnswers').addEventListener('click',()=>{session.answers={};document.querySelectorAll('#quizForm input[type=radio]').forEach(input=>input.checked=false);persist();document.querySelector('.progress-fill').style.width='0%';document.querySelector('.flex.justify-between.text-xs.text-slate-500 span').textContent=`0/${qs.length} câu đã trả lời`;document.querySelector('#quizForm .sticky p').textContent=`${qs.length} câu chưa trả lời`}); updateTimer(); clearInterval(timerInterval); timerInterval=setInterval(updateTimer,1000); document.querySelectorAll('#quizForm input').forEach(input=>input.addEventListener('change',e=>{const i=e.target.name.slice(1);session.answers[i]=Number(e.target.value);persist();document.querySelector('.progress-fill').style.width=`${Math.round(Object.keys(session.answers).length/qs.length*100)}%`;document.querySelector('.flex.justify-between.text-xs.text-slate-500 span').textContent=`${Object.keys(session.answers).length} /${qs.length} câu đã trả lời`}));document.getElementById('quizForm').addEventListener('submit',e=>{e.preventDefault();grade()}); }
  function formatDuration(totalSeconds){const seconds=Math.max(0,Number(totalSeconds)||0);const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
  function updateTimer(){if(!session?.deadlineAt)return;if(!startTime)startTime=new Date(session.startedAt||Date.now());const elapsed=Math.max(0,Math.floor((Date.now()-startTime.getTime())/1000));const elapsedEl=document.getElementById('elapsedTimerDisplay');if(elapsedEl)elapsedEl.textContent=formatDuration(elapsed);const left=Math.max(0,Math.ceil((session.deadlineAt-Date.now())/1000));const remainingEl=document.getElementById('deadlineTimer');if(remainingEl){remainingEl.textContent=`Còn ${formatDuration(left)}`;remainingEl.classList.toggle('text-rose-700',left<=60);remainingEl.classList.toggle('text-slate-500',left>60)}if(left===0){clearInterval(timerInterval);setTimeout(()=>grade(),0)}}
  function grade(){if(session?.status!=='taking')return;clearInterval(timerInterval);if(!startTime)startTime=new Date(session.startedAt||Date.now());const timeTakenSeconds=Math.floor((new Date()-startTime)/1000);const qs=session.questions;let correct=0;qs.forEach((q,i)=>{if(Number(session.answers[i])===Number(q.correctAnswer))correct++});const now=new Date().toISOString();const result={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:session.name,bankName:banks.find(b=>b.id===session.bankId)?.name||'Bài luyện tập pháp luật',correct,total:qs.length,percentage:Math.round(correct/qs.length*100),timestamp:now,timeTakenSeconds,questions:qs,answers:session.answers,cloudSyncStatus:'pending'};attempts.unshift(result);write(KEYS.attempts,attempts);session={...session,status:'result',resultId:result.id};persist();render();syncScoreToSupabase(result)}
  async function syncScoreToSupabase(result){try{if(!supabaseClient)throw new Error('Supabase client did not load.');const {error}=await supabaseClient.from('student_scores').insert({student_name:result.name,score:result.correct,total_questions:result.total,time_taken_seconds:result.timeTakenSeconds,responses:result.questions.map((q,i)=>({question:q.question,options:q.options,selected_answer:result.answers?.[i]??null,correct_answer:q.correctAnswer,explanation:q.explanation||''}))});if(error)throw error;result.cloudSyncStatus='saved';write(KEYS.attempts,attempts);if(session?.resultId===result.id)renderResult()}catch(error){console.warn('Supabase score save failed; the result remains available in this browser.',error);result.cloudSyncStatus='failed';write(KEYS.attempts,attempts);if(session?.resultId===result.id)renderResult()}}
  function renderResult(){clearInterval(timerInterval);const r=attempts.find(a=>a.id===session.resultId);if(!r){session=null;persist();renderHome();return}app.innerHTML=`<div class="max-w-5xl mx-auto fade-in"><button id="backHome" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-forest">← Quay lại trang luyện tập</button><div class="rounded-3xl bg-forest text-white p-6 sm:p-10 overflow-hidden relative"><div class="absolute -right-12 -top-20 w-64 h-64 rounded-full border border-white/10"></div><div class="absolute right-10 -bottom-36 w-64 h-64 rounded-full border border-white/10"></div><div class="relative flex flex-col md:flex-row md:items-center justify-between gap-7"><div><p class="text-sm text-white/70 font-semibold">HOÀN THÀNH BÀI LUYỆN TẬP</p><h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">Làm tốt lắm, ${esc(r.name)}.</h1><p class="mt-2 text-white/75">Kết quả của bạn ở bộ câu hỏi ${esc(r.bankName)}.</p><p class="mt-2 text-sm font-semibold text-white">✓ Đã nộp bài thành công · Thời gian làm: ${formatDuration(r.timeTakenSeconds)}</p></div><div class="flex items-center gap-5"><div class="w-28 h-28 rounded-full border-[6px] border-white/20 grid place-items-center"><div class="text-center"><div class="text-3xl font-extrabold">${r.percentage}%</div><div class="text-[10px] uppercase tracking-wider text-white/70">điểm</div></div></div><div><p class="text-xs uppercase tracking-wider text-white/65">Số câu đúng</p><p class="mt-1 text-2xl font-bold">${r.correct}<span class="text-white/55 text-lg font-medium"> / ${r.total}</span></p></div></div></div></div><p class="mt-3 text-sm ${r.cloudSyncStatus==='saved'?'text-emerald-700':r.cloudSyncStatus==='failed'?'text-amber-700':'text-slate-500'}" role="status">${r.cloudSyncStatus==='saved'?'Điểm đã được đồng bộ lên hệ thống.':r.cloudSyncStatus==='failed'?'Không thể đồng bộ điểm lúc này; kết quả vẫn được lưu trên thiết bị.':'Đang lưu kết quả lên hệ thống…'}</p><div class="mt-5 flex flex-wrap gap-3"><button id="againBtn" class="rounded-xl bg-forest px-5 py-3 text-sm font-bold text-white hover:bg-[#123c2f]">Làm lại</button><button id="downloadOne" class="rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold hover:bg-slate-50">Tải kết quả CSV</button></div><div class="mt-10 flex items-end justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-[.14em] text-forest">XEM LẠI ĐÁP ÁN</p><h2 class="mt-1 text-2xl font-extrabold">Học từ từng câu hỏi</h2></div><span class="text-sm text-slate-500">${r.total} câu hỏi</span></div><div class="mt-5 space-y-4">${r.questions.map((q,i)=>{const picked=r.answers?.[i];const isRight=Number(picked)===Number(q.correctAnswer);return `<article class="rounded-2xl border ${isRight?'border-emerald-200':'border-rose-200'} bg-white p-5 sm:p-6"><div class="flex items-start gap-3"><span class="w-8 h-8 shrink-0 grid place-items-center rounded-lg ${isRight?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'} text-sm font-extrabold">${i+1}</span><div><div class="flex flex-wrap items-center gap-2"><h3 class="font-bold leading-6">${esc(q.question)}</h3><span class="rounded-full px-2 py-1 text-[10px] font-extrabold uppercase tracking-wide ${isRight?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}">${isRight?'Đúng':'Cần xem lại'}</span></div><div class="mt-4 grid sm:grid-cols-2 gap-3"><div class="rounded-xl ${isRight?'bg-emerald-50':'bg-rose-50'} p-3.5"><p class="text-[10px] font-extrabold uppercase tracking-wider ${isRight?'text-emerald-700':'text-rose-700'}">Câu trả lời của bạn</p><p class="mt-1 text-sm font-semibold ${isRight?'text-emerald-950':'text-rose-950'}">${picked===undefined?'Chưa trả lời':esc(q.options[Number(picked)]??'Chưa trả lời')}</p></div><div class="rounded-xl bg-emerald-50 p-3.5"><p class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Đáp án đúng</p><p class="mt-1 text-sm font-semibold text-emerald-950">${esc(q.options[Number(q.correctAnswer)])}</p></div></div><div class="mt-3 rounded-xl bg-[#f7f8f6] p-4"><p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Giải thích</p><p class="mt-1.5 text-sm leading-6 text-slate-700">${esc(q.explanation||'Chưa có phần giải thích.')}</p></div></div></div></article>`}).join('')}</div></div>`;document.getElementById('backHome').addEventListener('click',()=>{session=null;persist();renderHome()});document.getElementById('againBtn').addEventListener('click',()=>{session=null;persist();renderHome()});document.getElementById('downloadOne').addEventListener('click',()=>downloadRows([r])); }
  function historyHTML(){return `<section class="mt-5 rounded-2xl border border-slate-200 bg-white p-5"><div class="flex items-center justify-between"><h3 class="font-bold">Các lần làm gần đây</h3><button class="closeHistory text-slate-400 hover:text-ink" aria-label="Đóng lịch sử">✕</button></div>${attempts.length?`<div class="mt-4 divide-y divide-slate-100">${attempts.slice(0,10).map((a,i)=>`<button class="history-row flex w-full items-center justify-between gap-4 py-3 text-left hover:bg-slate-50" data-index="${i}"><span><span class="block text-sm font-bold">${esc(a.name)}</span><span class="text-xs text-slate-500">${esc(a.bankName)} · ${new Date(a.timestamp).toLocaleString('vi-VN')}</span></span><span class="text-sm font-extrabold text-forest">${a.percentage}%</span></button>`).join('')}</div>`:'<p class="mt-3 text-sm text-slate-500">Chưa có lần làm bài nào.</p>'}</section>`}
  function renderManager(){const bank=activeBank();const json=JSON.stringify(bank.questions,null,2);app.innerHTML=`<div class="max-w-5xl mx-auto fade-in"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.14em] text-forest">CÔNG CỤ GIẢNG VIÊN</p><h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">Quản lý câu hỏi</h1><p class="mt-2 text-slate-600">Tạo và sắp xếp các bộ câu hỏi cho học viên luyện tập.</p></div><span class="rounded-full bg-mint/70 px-3 py-1.5 text-xs font-bold text-forest">Đã lưu trong trình duyệt này</span></div><div class="mt-8 grid lg:grid-cols-[.75fr_1.25fr] gap-5"><section class="rounded-2xl border border-[#e4e8e3] bg-white p-5 sm:p-6"><h2 class="text-lg font-extrabold">Các bộ câu hỏi</h2><p class="mt-1 text-sm text-slate-500">Chọn bộ câu hỏi hoặc tạo bộ mới.</p><div class="mt-4 space-y-2">${banks.map(b=>`<button data-bank="${esc(b.id)}" class="bank-select w-full text-left rounded-xl border ${b.id===activeBankId?'border-forest bg-[#f0f8f4]':'border-slate-200 hover:bg-slate-50'} p-3.5"><span class="block text-sm font-bold">${esc(b.name)}</span><span class="mt-0.5 block text-xs text-slate-500">${b.questions.length} câu hỏi</span></button>`).join('')}</div><button id="newBank" class="mt-3 w-full rounded-xl border border-dashed border-slate-300 px-4 py-3 text-sm font-bold text-slate-600 hover:border-forest hover:text-forest">＋ Tạo bộ câu hỏi mới</button><div class="mt-6 border-t border-slate-100 pt-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Định dạng câu hỏi</p><p class="mt-2 text-xs leading-5 text-slate-600">Dùng một mảng JSON. <code class="rounded bg-slate-100 px-1">correctAnswer</code> có thể là chỉ số bắt đầu từ 0 hoặc nội dung chính xác của đáp án.</p><div class="mt-3 flex flex-wrap gap-4"><button id="downloadTemplate" class="text-xs font-bold text-forest hover:underline">Tải mẫu JSON</button><button id="loadSampleQuestions" class="text-xs font-bold text-forest hover:underline">Nạp câu hỏi mẫu tiếng Việt</button></div></div></section><section class="rounded-2xl border border-[#e4e8e3] bg-white p-5 sm:p-6"><label for="bankName" class="block text-sm font-bold">Tên bộ câu hỏi</label><input id="bankName" maxlength="80" value="${esc(bank.name)}" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-forest focus:ring-4 focus:ring-forest/10"><label for="bankMinutes" class="mt-5 block text-sm font-bold">Thời lượng làm bài (phút)</label><input id="bankMinutes" type="number" min="1" max="600" value="${Number(bank.minutes)||20}" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-forest focus:ring-4 focus:ring-forest/10"><label for="questionJson" class="mt-5 block text-sm font-bold">Danh sách câu hỏi <span class="font-normal text-slate-500">· dán hoặc chỉnh sửa JSON</span></label><textarea id="questionJson" spellcheck="false" class="mt-2 min-h-[390px] w-full resize-y rounded-xl border border-slate-200 bg-[#fbfcfb] p-4 font-mono text-xs leading-5 text-slate-700 outline-none focus:border-forest focus:ring-4 focus:ring-forest/10" aria-describedby="jsonHint">${esc(json)}</textarea><p id="jsonHint" class="mt-2 text-xs text-slate-500">Mỗi câu hỏi cần có <code>question</code>, bốn <code>options</code>, <code>correctAnswer</code> và <code>explanation</code>.</p><p id="managerMessage" class="mt-2 min-h-5 text-sm" role="status" aria-live="polite"></p><div class="mt-3 flex flex-col sm:flex-row gap-2"><button id="saveBank" class="flex-1 rounded-xl bg-forest px-4 py-3 text-sm font-bold text-white hover:bg-[#123c2f]">Lưu bộ câu hỏi</button><button id="resetBank" class="rounded-xl border border-slate-200 px-4 py-3 text-sm font-bold hover:bg-slate-50">Đặt lại</button></div>${banks.length>1?'<button id="deleteBank" class="mt-4 text-xs font-semibold text-rose-700 hover:underline">Xóa bộ câu hỏi này</button>':''}</section></div><div class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-sm leading-6 text-amber-950"><strong>Quyền riêng tư:</strong> Bộ câu hỏi và điểm số chỉ được lưu trong trình duyệt này. Hãy tải CSV định kỳ nếu bạn cần lưu bản riêng.</div></div>`;
    document.querySelectorAll('.bank-select').forEach(b=>b.addEventListener('click',()=>{activeBankId=b.dataset.bank;write(KEYS.activeBank,activeBankId);renderManager()}));document.getElementById('bankName').addEventListener('input',e=>{bank.name=e.target.value;});document.getElementById('saveBank').addEventListener('click',()=>saveBank(false));document.getElementById('resetBank').addEventListener('click',()=>{document.getElementById('bankName').value=bank.name;document.getElementById('questionJson').value=JSON.stringify(bank.questions,null,2);document.getElementById('bankMinutes').value=Number(bank.minutes)||20;message('Đã khôi phục nội dung đã lưu gần nhất.','text-slate-500')});document.getElementById('newBank').addEventListener('click',()=>{const name=prompt('Nhập tên bộ câu hỏi mới');if(name===null)return;const b={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:name.trim()||'Bộ câu hỏi chưa đặt tên',minutes:20,questions:[]};banks.push(b);activeBankId=b.id;write(KEYS.banks,banks);write(KEYS.activeBank,activeBankId);renderManager()});document.getElementById('loadSampleQuestions').addEventListener('click',()=>{document.getElementById('questionJson').value=JSON.stringify(seed,null,2);message(`Đã nạp ${seed.length} câu hỏi mẫu tiếng Việt. Nhấn “Lưu bộ câu hỏi” để áp dụng.`,'text-emerald-700')});document.getElementById('downloadTemplate').addEventListener('click',()=>downloadText('jlaw-questions-template.json',JSON.stringify([{question:'Câu hỏi của bạn',options:['Lựa chọn A','Lựa chọn B','Lựa chọn C','Lựa chọn D'],correctAnswer:0,explanation:'Giải thích vì sao đây là đáp án đúng.'}],null,2),'application/json'));document.getElementById('deleteBank')?.addEventListener('click',()=>{if(!confirm(`Xóa “${bank.name}” và các câu hỏi?`))return;banks=banks.filter(b=>b.id!==bank.id);activeBankId=banks[0].id;write(KEYS.banks,banks);write(KEYS.activeBank,activeBankId);renderManager()}); }
  function message(s,color){const el=document.getElementById('managerMessage');el.textContent=s;el.className=`mt-2 min-h-5 text-sm ${color}`}
  function saveBank(silent){try{const parsed=JSON.parse(document.getElementById('questionJson').value);if(!Array.isArray(parsed))throw Error('Dữ liệu ngoài cùng phải là một mảng JSON.');const clean=parsed.map((q,i)=>{if(!q||typeof q!=='object')throw Error(`Câu ${i+1} phải là một đối tượng.`);if(typeof q.question!=='string'||!q.question.trim())throw Error(`Câu ${i+1} cần có nội dung câu hỏi.`);if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>typeof x!=='string'||!x.trim()))throw Error(`Câu ${i+1} phải có đúng bốn lựa chọn không để trống.`);let correct=q.correctAnswer;if(typeof correct==='string'){const found=q.options.findIndex(x=>x.trim()===correct.trim());if(found<0)throw Error(`Câu ${i+1}: giá trị correctAnswer phải khớp chính xác với một lựa chọn.`);correct=found}if(!Number.isInteger(correct)||correct<0||correct>3)throw Error(`Câu ${i+1}: correctAnswer phải là chỉ số từ 0 đến 3 hoặc nội dung đáp án khớp chính xác.`);return{question:q.question.trim(),options:q.options.map(x=>x.trim()),correctAnswer:correct,explanation:typeof q.explanation==='string'?q.explanation.trim():''}});const bank=banks.find(b=>b.id===activeBankId);bank.name=document.getElementById('bankName').value.trim()||'Bộ câu hỏi chưa đặt tên';bank.minutes=Math.max(1,Math.min(600,Number(document.getElementById('bankMinutes').value)||20));bank.questions=clean;write(KEYS.banks,banks);write(KEYS.activeBank,activeBankId);document.getElementById('questionJson').value=JSON.stringify(clean,null,2);document.querySelectorAll('.bank-select').forEach(b=>b.className=`bank-select w-full text-left rounded-xl border ${b.dataset.bank===activeBankId?'border-forest bg-[#f0f8f4]':'border-slate-200 hover:bg-slate-50'} p-3.5`);message(`Đã lưu ${clean.length} câu hỏi.`,'text-emerald-700');return true}catch(err){message(err.message,'text-rose-700');return false}}
  function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function downloadRows(rows){const data=[['Tên học viên','Bộ câu hỏi','Số câu đúng','Tổng số câu','Phần trăm','Thời gian làm (giây)','Thời gian nộp'],...rows.map(a=>[a.name,a.bankName,a.correct,a.total,a.percentage+'%',a.timeTakenSeconds??'',a.timestamp])];downloadText('jlaw-results.csv','\ufeff'+data.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
  function exportCSV(){if(!attempts.length){toast('Chưa có kết quả bài làm để tải xuống.');return}downloadRows(attempts)}function downloadText(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function toast(text){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.className='fixed bottom-5 left-1/2 -translate-x-1/2 z-50 rounded-xl bg-ink px-4 py-3 text-sm font-semibold text-white shadow-soft';document.body.appendChild(el)}el.textContent=text;el.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hidden'),2800)}
  document.getElementById('navPractice').addEventListener('click',e=>{if(session?.status==='taking'){e.preventDefault();return}persist();view='practice';history.replaceState(null,'',location.pathname);setView('practice')});document.getElementById('brandHome').addEventListener('click',e=>{e.preventDefault();if(session?.status==='taking')return;persist();view='practice';history.replaceState(null,'',location.pathname);setView('practice')});document.getElementById('year').textContent=new Date().getFullYear();app.addEventListener('click',e=>{if(e.target.closest('.closeHistory')){document.getElementById('historyPanel').innerHTML='';return}const row=e.target.closest('.history-row');if(row){const a=attempts[Number(row.dataset.index)];session={status:'result',resultId:a.id};setView('practice')}});render();
})();
